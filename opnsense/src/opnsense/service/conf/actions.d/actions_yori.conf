[start]
command:/usr/local/etc/rc.d/yori start
parameters:
type:script
message:Starting YORI LLM Gateway

[stop]
command:/usr/local/etc/rc.d/yori stop
parameters:
type:script
message:Stopping YORI LLM Gateway

[restart]
command:/usr/local/etc/rc.d/yori restart
parameters:
type:script
message:Restarting YORI LLM Gateway

[status]
command:/usr/local/etc/rc.d/yori status; exit 0
parameters:
type:script_output
message:Requesting YORI service status

[reconfigure]
command:/usr/local/yori-venv/bin/python3.11 -m yori.cli reconfigure
parameters:
type:script
message:Reconfiguring YORI

