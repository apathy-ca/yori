# YORI Test Configuration for Load Testing
# Simplified config for testing without TLS

mode: observe
listen: "0.0.0.0:8080"

endpoints:
  - domain: "api.openai.com"
    enabled: true
  - domain: "api.anthropic.com"
    enabled: true

audit:
  database: "/tmp/yori_test_audit.db"
  retention_days: 7

policies:
  directory: "./policies"
  default: "home_default.rego"

enforcement:
  enabled: false
  consent_accepted: false
